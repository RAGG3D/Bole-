name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Python
        run: python3 --version
      - name: Lint community data
        run: python3 scripts/ats_lint.py
      - name: Run offline unit tests
        run: python3 -m unittest discover tests
