<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
@page { size: A4; margin: 12mm 14mm; }
* { box-sizing: border-box; }
body {
  zoom: {{ZOOM}};
  margin: 0;
  color: #3D3D3D;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 10.2pt;
  line-height: 1.32;
}
h1 { color: #1E3892; font-size: 23pt; letter-spacing: .2px; margin: 0 0 2px; }
.subtitle { color: #1E3892; font-size: 11.5pt; font-weight: 700; margin-bottom: 4px; }
.contact { font-size: 8.7pt; margin-bottom: 8px; overflow-wrap: anywhere; }
.profile { margin: 0 0 8px; }
h2 { color: #1E3892; font-size: 11.5pt; margin: 8px 0 3px; letter-spacing: .5px; }
.entry { break-inside: avoid; margin: 0 0 5px; }
.entry-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
.entry-org { color: #1E3892; font-weight: 700; }
.meta { color: #666; font-size: 8.7pt; text-align: right; white-space: nowrap; }
ul { margin: 2px 0 0 17px; padding: 0; }
li { margin: 0 0 1.5px; }
</style>
</head>
<body>
<h1>{{NAME}}</h1>
<div class="subtitle">{{SUBTITLE}}</div>
<div class="contact">{{CONTACT}}</div>
<p class="profile">{{PROFILE}}</p>
{{SECTIONS}}
</body>
</html>
